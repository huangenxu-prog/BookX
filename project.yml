name: BookX
options:
  bundleIdPrefix: com.huangenxu
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  BookX:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [BookX]
    dependencies:
      - package: ZIPFoundation
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: BookX
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, org.idpf.epub-container]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB book
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [epub]
              public.mime-type: application/epub+zip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.BookX
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
  BookXUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UITests
      - path: Tests/Fixtures/ordered.epub
        buildPhase: resources
    dependencies:
      - target: BookX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.BookX.UITests
        TEST_TARGET_NAME: BookX
        SWIFT_VERSION: 5.9
        CODE_SIGNING_ALLOWED: NO
schemes:
  BookX:
    build:
      targets:
        BookX: all
    test:
      targets: [BookXUITests]
