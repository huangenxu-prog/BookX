name: BookX
options:
  bundleIdPrefix: com.huangenxu
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.8.0
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    exactVersion: 3.0.1
targets:
  BookX:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookX
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: ZIPFoundation
        product: ReadiumZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.BookX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
  BookXUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
      - path: Tests/Fixtures/ordered.epub
        buildPhase: resources
    dependencies:
      - target: BookX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  BookX:
    build:
      targets:
        BookX: all
    test:
      targets:
        - BookXUITests
