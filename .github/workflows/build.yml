name: Build BookX iOS
# Build triggered by pushes to the BookX development branch.
on:
  workflow_dispatch:
  push:
    branches: [main, feature/epub-on-demand]
concurrency:
  group: bookx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.2 (iOS 26 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate synthetic EPUB fixtures
        run: python3 scripts/make_test_epubs.py
      - name: Test book parsing and reading positions
        run: |
          set -o pipefail
          swift test | tee tests.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare app icon
        run: |
          sips -z 1024 1024 BookX/Assets.xcassets/AppIcon.appiconset/IMG_2626.png --out BookX/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          sips -g pixelWidth -g pixelHeight BookX/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Install uploaded book spine assets
        run: |
          set -euo pipefail
          archive="BookX/BookX10Spines.zip"
          test -s "$archive"
          unzip -oq "$archive" -d BookX/Assets.xcassets/
          for n in $(seq -w 1 10); do
            test -s "BookX/Assets.xcassets/BookSpine${n}.imageset/BookSpine${n}.png"
            test -s "BookX/Assets.xcassets/BookSpine${n}.imageset/Contents.json"
          done
          test -s "BookX/Assets.xcassets/BookShelfWood.imageset/BookShelfWood.png"
          test -s "BookX/Assets.xcassets/BookShelfWood.imageset/Contents.json"
          echo "Installed 10 book spine assets and wooden shelf."
      - name: Install twelve minimalist book covers
        run: |
          set -euo pipefail
          # The user uploaded the PNG archive to the repository default branch.
          # Fetch that exact binary directly; do not re-crop or recolor it.
          git fetch --depth=1 origin main
          archive="BookX/Assets.xcassets/AppIcon.appiconset/BookX_Minimal_Covers_12.zip"
          # This archive was removed from main after upload; pin its original
          # upload commit so the already-approved cover artwork stays unchanged.
          cover_commit="b57a21f8fb70d5273f915056a06f50c235d233bf"
          git fetch --depth=1 origin "$cover_commit"
          git show "$cover_commit:$archive" > /tmp/BookX_Minimal_Covers_12.zip
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          archive = Path("/tmp/BookX_Minimal_Covers_12.zip")
          base = Path("BookX/Assets.xcassets")
          with zipfile.ZipFile(archive) as z:
              for n in range(1, 13):
                  name = f"BookCover{n:02d}.png"
                  matches = [p for p in z.namelist() if Path(p).name == name and not p.startswith("__MACOSX/")]
                  if len(matches) != 1:
                      raise RuntimeError(f"Expected exactly one {name}; found {matches}")
                  dest = base / f"BookCover{n:02d}.imageset"
                  dest.mkdir(parents=True, exist_ok=True)
                  (dest / name).write_bytes(z.read(matches[0]))
                  (dest / "Contents.json").write_text(json.dumps({
                      "images": [{"filename": name, "idiom": "universal"}],
                      "info": {"author": "xcode", "version": 1}
                  }))
          print("Installed 12 minimalist PNG book covers without cropping")
          PY
      - name: Install ten minimalist book-spine assets
        run: |
          set -euo pipefail
          archive="BookX/Assets.xcassets/AppIcon.appiconset/BookX_Minimal_Spines_10.zip"
          git show "origin/main:$archive" > /tmp/BookX_Minimal_Spines_10.zip
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          base = Path("BookX/Assets.xcassets")
          with zipfile.ZipFile("/tmp/BookX_Minimal_Spines_10.zip") as z:
              for n in range(1, 11):
                  name = f"BookSpine{n:02d}.png"
                  matches = [p for p in z.namelist() if Path(p).name == name and not p.startswith("__MACOSX/")]
                  if len(matches) != 1:
                      raise RuntimeError(f"Expected one {name}, found {matches}")
                  dest = base / f"BookSpine{n:02d}.imageset"
                  dest.mkdir(parents=True, exist_ok=True)
                  (dest / name).write_bytes(z.read(matches[0]))
                  (dest / "Contents.json").write_text(json.dumps({
                      "images": [{"filename": name, "idiom": "universal"}],
                      "info": {"author": "xcode", "version": 1}
                  }))
          print("Installed ten minimalist spine assets without changing library layout")
          PY
      - name: Generate project
        run: xcodegen generate
      - name: Compile simulator app
        run: |
          set -o pipefail
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath SimulatorBuild CODE_SIGNING_ALLOWED=NO build | tee simulator.log
      - name: Verify reading and resume on iPhone simulator
        run: |
          set -o pipefail
          BOOKX_DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$BOOKX_DEVICE" || true
          xcrun simctl bootstatus "$BOOKX_DEVICE" -b
          # Xcode's UI-test runner can be killed during bootstrap on hosted macOS.
          # Keep UI tests enabled, run serially, and retry only a startup failure.
          for attempt in 1 2; do
            result_bundle="ReaderTests-attempt${attempt}.xcresult"
            set +e
            xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Debug -destination "platform=iOS Simulator,id=$BOOKX_DEVICE" -derivedDataPath SimulatorBuild -resultBundlePath "$result_bundle" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "runtime-tests-attempt${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              cp "runtime-tests-attempt${attempt}.log" runtime-tests.log
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && grep -Eq 'Early unexpected exit, operation never finished bootstrapping|Test crashed with signal kill while preparing to run tests' "runtime-tests-attempt${attempt}.log"; then
              echo "UI test runner died during bootstrap; retrying once"
              xcrun simctl terminate "$BOOKX_DEVICE" "$( /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' SimulatorBuild/Build/Products/Debug-iphonesimulator/BookX.app/Info.plist )" || true
              continue
            fi
            cp "runtime-tests-attempt${attempt}.log" runtime-tests.log
            exit "$status"
          done
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R DeviceBuild/Build/Products/Release-iphoneos/BookX.app package/Payload/
          test -f package/Payload/BookX.app/BookX
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/BookX.app/Info.plist
          lipo -info package/Payload/BookX.app/BookX
          cd package
          zip -qr ../BookX-1.0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BookX-1.0-unsigned
          path: BookX-1.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BookX-validation
          path: |
            tests.log
            build.log
            simulator.log
            runtime-tests.log
            ReaderTests-*.xcresult
