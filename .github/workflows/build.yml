name: Build BookX iOS
# Build triggered by pushes to the BookX development branch.
on:
  workflow_dispatch:
  push:
    branches: [main, feature/epub-on-demand]
concurrency:
  group: bookx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.2 (iOS 26 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate synthetic EPUB fixtures
        run: python3 scripts/make_test_epubs.py
      - name: Test book parsing and reading positions
        run: |
          set -o pipefail
          swift test | tee tests.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare app icon
        run: |
          sips -z 1024 1024 BookX/Assets.xcassets/AppIcon.appiconset/IMG_2626.png --out BookX/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          sips -g pixelWidth -g pixelHeight BookX/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Install uploaded book spine assets
        run: |
          set -euo pipefail
          archive="BookX/BookX10Spines.zip"
          test -s "$archive"
          unzip -oq "$archive" -d BookX/Assets.xcassets/
          for n in $(seq -w 1 10); do
            test -s "BookX/Assets.xcassets/BookSpine${n}.imageset/BookSpine${n}.png"
            test -s "BookX/Assets.xcassets/BookSpine${n}.imageset/Contents.json"
          done
          test -s "BookX/Assets.xcassets/BookShelfWood.imageset/BookShelfWood.png"
          test -s "BookX/Assets.xcassets/BookShelfWood.imageset/Contents.json"
          echo "Installed 10 book spine assets and wooden shelf."
      - name: Install twelve illustrated book covers
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow numpy
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          archive = Path("BookX/Assets.xcassets/AppIcon.appiconset/BookX_Covers_12.zip")
          if not archive.is_file():
              raise SystemExit("Missing uploaded BookX_Covers_12.zip")
          base = Path("BookX/Assets.xcassets")
          with zipfile.ZipFile(archive) as z:
              for n in range(1, 13):
                  name = f"BookCover{n:02d}.jpg"
                  dest = base / f"BookCover{n:02d}.imageset"
                  dest.mkdir(parents=True, exist_ok=True)
                  (dest / name).write_bytes(z.read(name))
                  # Detect the actual outer book edges in the original image.
                  # Do not use a fixed crop: the twelve photographed books have
                  # different top/side margins. Preserve the entire book/spine.
                  from PIL import Image, ImageChops
                  import io
                  source = Image.open(io.BytesIO(z.read(name))).convert("RGB")
                  import numpy as np
                  pixels = np.asarray(source, dtype=np.int16)
                  height, width = pixels.shape[:2]
                  # Background is nearly uniform beige. Estimate it from corners.
                  corners = np.concatenate([
                      pixels[:35, :35].reshape(-1, 3),
                      pixels[:35, -35:].reshape(-1, 3),
                      pixels[-35:, :35].reshape(-1, 3),
                      pixels[-35:, -35:].reshape(-1, 3)
                  ])
                  backdrop = np.median(corners, axis=0)
                  distance = np.max(np.abs(pixels - backdrop), axis=2)
                  # A row/column belongs to the book when a substantial part
                  # differs from the surrounding paper. Ignore soft drop shadows.
                  foreground = distance > 38
                  rows = np.where(foreground.sum(axis=1) > width * 0.25)[0]
                  cols = np.where(foreground.sum(axis=0) > height * 0.25)[0]
                  if len(rows) < 200 or len(cols) < 120:
                      raise RuntimeError(f"Cannot identify complete book: {name}")
                  x0, x1 = max(0, int(cols[0]) - 3), min(width, int(cols[-1]) + 4)
                  y0, y1 = max(0, int(rows[0]) - 3), min(height, int(rows[-1]) + 4)
                  book = source.crop((x0, y0, x1, y1))
                  # Use a transparent canvas matching the physical book ratio.
                  # Aspect-fit later in SwiftUI avoids clipping book edges.
                  book.save(dest / name, quality=95)
                  print(f"{name}: book bounds {(x0,y0,x1,y1)}")
                  contents = {"images": [{"filename": name, "idiom": "universal"}],
                              "info": {"author": "xcode", "version": 1}}
                  (dest / "Contents.json").write_text(json.dumps(contents))
          print("Installed 12 illustrated covers")
          PY
      - name: Generate project
        run: xcodegen generate
      - name: Compile simulator app
        run: |
          set -o pipefail
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath SimulatorBuild CODE_SIGNING_ALLOWED=NO build | tee simulator.log
      - name: Verify reading and resume on iPhone simulator
        run: |
          set -o pipefail
          BOOKX_DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$BOOKX_DEVICE" || true
          xcrun simctl bootstatus "$BOOKX_DEVICE" -b
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Debug -destination "platform=iOS Simulator,id=$BOOKX_DEVICE" -derivedDataPath SimulatorBuild -resultBundlePath ReaderTests.xcresult CODE_SIGNING_ALLOWED=NO test | tee runtime-tests.log
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R DeviceBuild/Build/Products/Release-iphoneos/BookX.app package/Payload/
          test -f package/Payload/BookX.app/BookX
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/BookX.app/Info.plist
          lipo -info package/Payload/BookX.app/BookX
          cd package
          zip -qr ../BookX-1.0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BookX-1.0-unsigned
          path: BookX-1.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BookX-validation
          path: |
            tests.log
            build.log
            simulator.log
            runtime-tests.log
            ReaderTests.xcresult
