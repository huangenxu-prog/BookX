name: Build BookX iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: bookx-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test book parsing and reading positions
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Choose iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test import, reading, and resume on iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee simulator.log
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project BookX.xcodeproj -scheme BookX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R DeviceBuild/Build/Products/Release-iphoneos/BookX.app package/Payload/
          test -f package/Payload/BookX.app/BookX
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/BookX.app/Info.plist
          lipo -info package/Payload/BookX.app/BookX
          cd package
          zip -qr ../BookX-1.0-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BookX-1.0-unsigned
          path: BookX-1.0-unsigned.ipa
      - name: Export UI screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BookX-validation
          path: |
            build.log
            simulator.log
            screenshots
            TestResults.xcresult
